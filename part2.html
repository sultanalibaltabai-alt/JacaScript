<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Part 2: Bootstrap Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="p-4">
    <nav class="nav nav-pills mb-4">
        <a class="nav-link" href="index.html">Part 1: Basic Form</a>
        <a class="nav-link active" href="part2.html">Part 2: Bootstrap Form</a>
        <a class="nav-link" href="part3.html">Part 3: Registration Form</a>
    </nav>

    <h2>Bootstrap Contact Form</h2>
    <form class="needs-validation" novalidate>
        <div class="row mb-3">
            <div class="col-md-6">
                <label for="name" class="form-label">Name</label>
                <input type="text" class="form-control" id="name" placeholder="Enter your name" required>
                <div class="valid-feedback">Looks good!</div>
                <div class="invalid-feedback">Name is required.</div>
            </div>
        </div>
        <div class="row mb-3">
            <div class="col-md-6">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
                <div class="form-text">We'll never share your email with anyone else.</div>
                <div class="valid-feedback">Looks good!</div>
                <div class="invalid-feedback">Email is required and must be valid.</div>
            </div>
        </div>
        <div class="row mb-3">
            <div class="col-md-6">
                <label for="message" class="form-label">Message</label>
                <textarea class="form-control" id="message" rows="3" placeholder="Write your message here" required></textarea>
                <div class="valid-feedback">Looks good!</div>
                <div class="invalid-feedback">Message is required.</div>
            </div>
        </div>
        <button class="btn btn-primary" type="submit">Submit</button>
    </form>

    <script>
        (() => {
            'use strict'
            const forms = document.querySelectorAll('.needs-validation')
            Array.from(forms).forEach(form => {
                form.addEventListener('submit', event => {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }
                    form.classList.add('was-validated')
                }, false)
            })
        })()
    </script>
</body>
</html>
